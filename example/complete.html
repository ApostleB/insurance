<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>접수완료 - 든든보험 맞춤케어</title>
  
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            mint: {
              50: '#f0fdfa',
              500: '#14b8a6',
              600: '#0d9488',
            },
            kakao: '#FEE500',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-brand-500 selection:text-white">

  <main class="mx-auto flex min-h-screen max-w-lg flex-col justify-center px-4 py-12">
    
    <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-xl sm:p-8 text-center">
      
      <!-- 성공 체크 아이콘 애니메이션 -->
      <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-mint-50 text-mint-500 ring-8 ring-mint-50/50">
        <svg class="h-10 w-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
        </svg>
      </div>

      <span id="badgeType" class="mt-5 inline-flex rounded-full bg-brand-50 px-3 py-1 text-xs font-bold text-brand-700">
        신청 완료
      </span>

      <h1 class="mt-2 text-2xl font-black text-slate-900">
        <span id="userName" class="text-brand-600">고객</span>님의 신청이<br>정상적으로 접수되었습니다!
      </h1>

      <p class="mt-3 text-sm leading-relaxed text-slate-600">
        접수해주신 내용을 확인한 뒤 <b class="font-bold text-slate-800">담당 설계사가 빠른 시일 내에 연락</b>드리겠습니다.
      </p>

      <!-- 진행 단계 스테퍼 -->
      <div class="mt-6 rounded-2xl border border-slate-100 bg-slate-50/80 p-4 text-left">
        <h2 class="text-xs font-bold text-slate-700">📌 향후 진행 프로세스</h2>
        
        <div class="mt-3 space-y-3">
          <div class="flex items-start gap-3">
            <div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-brand-600 text-xs font-bold text-white">1</div>
            <div>
              <p class="text-xs font-bold text-slate-800">신청 접수 확인</p>
              <p class="text-[11px] text-slate-500">담당 설계사에게 실시간 전달 완료</p>
            </div>
          </div>
          <div class="flex items-start gap-3">
            <div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-slate-200 text-xs font-bold text-slate-600">2</div>
            <div>
              <p class="text-xs font-bold text-slate-800">1:1 맞춤 유선 / 카톡 상담</p>
              <p class="text-[11px] text-slate-500">필요 서류 및 30개사 비교 견적표 안내</p>
            </div>
          </div>
          <div class="flex items-start gap-3">
            <div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-slate-200 text-xs font-bold text-slate-600">3</div>
            <div>
              <p class="text-xs font-bold text-slate-800">청구 대행 또는 맞춤 가입 진행</p>
              <p class="text-[11px] text-slate-500">불필요한 지출 절감 & 보장 최적화</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 빠른 다이렉트 문의 -->
      <div class="mt-6 border-t border-slate-100 pt-5">
        <p class="text-xs text-slate-500 mb-3">급한 청구 건이나 추가 문의가 있으신가요?</p>
        <div class="grid grid-cols-2 gap-2">
          <a href="tel:010-1234-1234" class="flex h-11 items-center justify-center gap-1.5 rounded-xl bg-slate-900 text-xs font-bold text-white transition hover:bg-slate-800">
            📞 전화 연결
          </a>
          <a href="https://open.kakao.com/o/sxhGO79h" target="_blank" rel="noopener noreferrer" class="flex h-11 items-center justify-center gap-1.5 rounded-xl bg-kakao text-xs font-bold text-[#3C1E1E] transition hover:brightness-95">
            💬 카톡 상담
          </a>
        </div>
      </div>

      <div class="mt-6">
        <a href="index.html" class="inline-flex w-full items-center justify-center rounded-xl bg-slate-100 py-3 text-xs font-bold text-slate-700 hover:bg-slate-200">
          메인 홈으로 돌아가기
        </a>
      </div>

    </div>

  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');
    const name = params.get('name');

    if (name) {
      document.getElementById('userName').textContent = name;
    }
    if (type === 'claim') {
      document.getElementById('badgeType').textContent = '보험금 청구 접수 완료';
      document.getElementById('badgeType').className = 'mt-5 inline-flex rounded-full bg-amber-50 px-3 py-1 text-xs font-bold text-amber-800';
    } else {
      document.getElementById('badgeType').textContent = '설계 및 보장분석 접수 완료';
    }
  </script>
</body>
</html>
